		.d2-4107359318 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y2FsbDE="><g class="shape" ><rect x="243" y="0" width="284" height="82" stroke="#0D32B2" fill="#e8eaf6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="385" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="385" dy="0">线程调用 read(fd, buf, size)</tspan><tspan x="385" dy="18.5">-&gt; 文件描述符已设为非阻塞</tspan></text></g><g class="cG9sbDE="><g class="shape" ><rect x="10" y="202" width="711" height="158" stroke="#0D32B2" fill="#fff3e0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="365.5" y="189" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">第 N 次轮询：数据未到</text></g><g class="YXJyb3c="><g class="shape" ><rect x="438" y="480" width="250" height="66" stroke="#0D32B2" fill="#f5f5f5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="563" y="518.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">...... 反复轮询若干次 ......</text></g><g class="Y2FsbDI="><g class="shape" ><rect x="416" y="646" width="293" height="82" stroke="#0D32B2" fill="#c8e6c9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="684.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="562.5" dy="0">线程再次调用 read(fd, buf, size)</tspan><tspan x="562.5" dy="18.5">-&gt; 这次数据到了</tspan></text></g><g class="c3RhZ2Uy"><g class="shape" ><rect x="398" y="848" width="329" height="340" stroke="#0D32B2" fill="#e3f2fd" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="835" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">阶段2：拷贝数据（有数据了，所以堵）</text></g><g class="cmV0"><g class="shape" ><rect x="415" y="1308" width="295" height="66" stroke="#0D32B2" fill="#a5d6a7" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="1346.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">read() 返回 1024 -&gt; buf 里有数据</text></g><g class="cG9sbDEudA=="><g class="shape" ><rect x="40" y="232" width="334" height="98" stroke="#0D32B2" fill="#ffe0b2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="207" y="270.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="207" dy="0">线程 -&gt; TASK_RUNNING（不挂起）</tspan><tspan x="207" dy="17.666667">read() 立刻返回 0</tspan><tspan x="207" dy="17.666667">线程继续跑，可以 check 其他连接</tspan></text></g><g class="cG9sbDEuaw=="><g class="shape" ><rect x="434" y="240" width="257" height="82" stroke="#0D32B2" fill="#ffcc80" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="278.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="562.5" dy="0">内核：Socket 缓冲区空的</tspan><tspan x="562.5" dy="18.5">立即告诉线程: 没有数据</tspan></text></g><g class="c3RhZ2UyLnQy"><g class="shape" ><rect x="435" y="1060" width="255" height="98" stroke="#0D32B2" fill="#90caf9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="1098.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="562.5" dy="0">线程 -&gt; 参与拷贝</tspan><tspan x="562.5" dy="17.666667">这次 read() 不会立刻返回</tspan><tspan x="562.5" dy="17.666667">耗时 ~5us</tspan></text></g><g class="c3RhZ2UyLmsy"><g class="shape" ><rect x="428" y="878" width="269" height="82" stroke="#0D32B2" fill="#64b5f6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="916.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="562.5" dy="0">内核：Socket buf -&gt; 用户 buf</tspan><tspan x="562.5" dy="18.5">memcpy 执行中</tspan></text></g><g class="KGNhbGwxIC0mZ3Q7IHBvbGwxLmspWzBd"><marker id="mk-d2-4107359318-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 466.281524 82.90894 C 542.900024 122 562.5 193.600006 562.5 236" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4107359318-3488378134)" mask="url(#d2-4107359318)" /></g><g class="KGNhbGwxIC0mZ3Q7IHBvbGwxLnQpWzBd"><path d="M 303.218476 82.908941 C 226.600006 122 207 192 207 228" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4107359318-3488378134)" mask="url(#d2-4107359318)" /></g><g class="KHBvbGwxIC0mZ3Q7IGFycm93KVswXQ=="><path d="M 562.5 362 C 562.5 416 562.5 440 562.5 476" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4107359318-3488378134)" mask="url(#d2-4107359318)" /></g><g class="KGFycm93IC0mZ3Q7IGNhbGwyKVswXQ=="><path d="M 562.5 548 C 562.5 586 562.5 606 562.5 642" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4107359318-3488378134)" mask="url(#d2-4107359318)" /></g><g class="KGNhbGwyIC0mZ3Q7IHN0YWdlMi5rMilbMF0="><path d="M 562.5 730 C 562.5 768 562.5 838 562.5 874" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4107359318-3488378134)" mask="url(#d2-4107359318)" /></g><g class="c3RhZ2UyLihrMiAtJmd0OyB0MilbMF0="><path d="M 562.5 962 C 562.5 1000 562.5 1020 562.5 1056" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4107359318-3488378134)" mask="url(#d2-4107359318)" /></g><g class="
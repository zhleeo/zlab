		.d2-133146623 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y2FsbA=="><g class="shape" ><rect x="59" y="0" width="253" height="66" stroke="#0D32B2" fill="#e8eaf6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="185.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">线程调用 read(fd, buf, size)</text></g><g class="c3RhZ2Ux"><g class="shape" ><rect x="10" y="186" width="637" height="158" stroke="#0D32B2" fill="#fff3e0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="328.5" y="173" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">阶段1：等待数据</text></g><g class="YXJyaXZlZA=="><g class="shape" ><rect x="384" y="464" width="240" height="82" stroke="#0D32B2" fill="#c8e6c9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="504" y="502.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="504" dy="0">数据到达 Socket 缓冲区</tspan><tspan x="504" dy="18.5">内核唤醒此线程</tspan></text></g><g class="c3RhZ2Uy"><g class="shape" ><rect x="341" y="666" width="326" height="340" stroke="#0D32B2" fill="#e3f2fd" class=" stroke-B1" style="stroke-width:2;" /></g><text x="504" y="653" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">阶段2：拷贝数据</text></g><g class="cmV0"><g class="shape" ><rect x="376" y="1126" width="256" height="66" stroke="#0D32B2" fill="#a5d6a7" class=" stroke-B1" style="stroke-width:2;" /></g><text x="504" y="1164.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">read() 返回 → buf 里有数据</text></g><g class="c3RhZ2UxLnQx"><g class="shape" ><rect x="40" y="216" width="291" height="98" stroke="#0D32B2" fill="#ffe0b2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="185.5" y="254.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="185.5" dy="0">线程 → TASK_INTERRUPTIBLE</tspan><tspan x="185.5" dy="17.666667">挂起、让出 CPU、不消耗 CPU</tspan><tspan x="185.5" dy="17.666667">但占着 ~1MB 栈内存</tspan></text></g><g class="c3RhZ2UxLmsx"><g class="shape" ><rect x="391" y="224" width="226" height="82" stroke="#0D32B2" fill="#ffcc80" class=" stroke-B1" style="stroke-width:2;" /></g><text x="504" y="262.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="504" dy="0">内核：数据还在路上</tspan><tspan x="504" dy="18.5">Socket 缓冲区是空的</tspan></text></g><g class="c3RhZ2UyLnQy"><g class="shape" ><rect x="375" y="878" width="259" height="98" stroke="#0D32B2" fill="#90caf9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="504.5" y="916.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="504.5" dy="0">线程 → TASK_RUNNING</tspan><tspan x="504.5" dy="17.666667">线程参与拷贝（~5μs）</tspan><tspan x="504.5" dy="17.666667">CPU 这段时间不能干别的</tspan></text></g><g class="c3RhZ2UyLmsy"><g class="shape" ><rect x="371" y="696" width="266" height="82" stroke="#0D32B2" fill="#64b5f6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="504" y="734.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="504" dy="0">内核：Socket buf → 用户 buf</tspan><tspan x="504" dy="18.5">memcpy 执行中</tspan></text></g><g class="KGNhbGwgLSZndDsgc3RhZ2UxLnQxKVswXQ=="><marker id="mk-d2-133146623-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d=
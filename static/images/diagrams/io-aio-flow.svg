		.d2-1342734541 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="Y2FsbA=="><g class="shape" ><rect x="196" y="0" width="280" height="98" stroke="#0D32B2" fill="#e8eaf6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="336" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="336" dy="0">线程调用 io_uring_submit(sqe)</tspan><tspan x="336" dy="17.666667">→ 提交一个读请求到 SQ</tspan><tspan x="336" dy="17.666667">→ **立刻返回**</tspan></text></g><g class="Zm9yaw=="><g class="shape" ><rect x="0" y="227" width="685" height="493" stroke="#0D32B2" fill="#f5f5f5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="342.5" y="214" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">fork</text></g><g class="ZG9uZQ=="><g class="shape" ><rect x="725" y="570" width="256" height="82" stroke="#0D32B2" fill="#bbdefb" class=" stroke-B1" style="stroke-width:2;" /></g><text x="853" y="608.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="853" dy="0">内核写入 CQ：完成事件</tspan><tspan x="853" dy="18.5">（数据已在用户 buf 中）</tspan></text></g><g class="Y2hlY2s="><g class="shape" ><rect x="689" y="860" width="329" height="82" stroke="#0D32B2" fill="#a5d6a7" class=" stroke-B1" style="stroke-width:2;" /></g><text x="853.5" y="898.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="853.5" dy="0">线程忙完了，看一眼 CQ</tspan><tspan x="853.5" dy="18.5">io_uring_peek_cqe() → 读请求已完成</tspan></text></g><g class="cmV0"><g class="shape" ><rect x="710" y="1042" width="286" height="98" stroke="#0D32B2" fill="#81c784" class=" stroke-B1" style="stroke-width:2;" /></g><text x="853" y="1080.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="853" dy="0">buf 里数据就绪</tspan><tspan x="853" dy="17.666667">全程线程没有一次睡眠等待</tspan><tspan x="853" dy="17.666667">也没有一次主动拷贝</tspan></text></g><g class="Zm9yay51c2Vy"><g class="shape" ><rect x="349" y="268" width="306" height="174" stroke="#0D32B2" fill="#e8f5e9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="502" y="256" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:24px">线程（全程不堵）</text></g><g class="Zm9yay5rZXJuZWw="><g class="shape" ><rect x="30" y="284" width="279" height="406" stroke="#0D32B2" fill="#e3f2fd" class=" stroke-B1" style="stroke-width:2;" /></g><text x="169.5" y="272" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:24px">内核后台（全自动）</text></g><g class="Zm9yay51c2VyLndvcms="><g class="shape" ><rect x="379" y="298" width="246" height="114" stroke="#0D32B2" fill="#c8e6c9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="502" y="336.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="502" dy="0">线程继续跑业务代码</tspan><tspan x="502" dy="17.25">处理其他请求、算东西</tspan><tspan x="502" dy="17.25">完全不碰 I/O</tspan><tspan x="502" dy="17.25">状态始终 TASK_RUNNING</tspan></text></g><g class="Zm9yay5rZXJuZWwuc3RhZ2Ux"><g class="shape" ><rect x="60" y="314" width="219" height="82" stroke="#0D32B2" fill="#fff3e0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="169.5" y="352.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="169.5" dy="0">阶段1：等数据</tspan><tspan x="169.5" dy="18.5">→ 数据到达 Socket buf</tspan></text></g><g class="Zm9yay5rZXJuZWwuc3RhZ2Uy"><g class="shape" ><rect x="67" y="562" width="206" height="98" stroke="#0D32B2" fill="#90caf9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="170" y="600.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="170" dy="0">阶段2：拷贝数据</tspan><tspan x="170" dy="17.666667">Socket buf → 用户 buf</tspan><tspan x="170" dy="17.666667">→ 线程不参与</tspan></text></g><g class="Zm9yay5rZXJuZWwuKHN0YWdlMSAtJmd0OyBzdGFnZTIpWzBd"><marker id="mk-d2-1342734541-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 169.5 398 C 169.5 448.799988 169.5 522 169.5 558" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1342734541-3488378134)" mask="url(#d2-1342734541)" /></g><g class="KGNhbGwgLSZndDsgZm9yay51c2VyLndvcmspWzBd"><path d="M 419.718586 99.022968 C 485.200012 138 502 158 502 173 C 502 188 502 258 502 294" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1342734541-3488378134)" mask="url(#d2-1342734541)" /></g><g class="KGNhbGwgLSZndDsgZm9yay5rZXJuZWwuc3RhZ2UxKVswXQ=="><path d="M 251.781414 99.022968 C 186.300003 138 169.5 158 169.5 173 C 169.5 188 169.5 261.200012 169.5 310" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1342734541-3488378134)" mask="url(#d2-1342734541)" /></g><g class="KGZvcmsgLSZndDsgZG9uZSlbMF0="><path d="M 686.928411 564.530313 L 721.143178 573.939374" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1342734541-3488378134)" mask="url(#d2-1342734541)" /></g><g class="KGRvbmUgLSZndDsgY2hlY2spWzBd"><path d="M 853 654 C 853 698.400024 853 720 853 735 C 853 750 853 820 853 856" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1342734541-3488378134)" mask="url(#d2-1342734541)" /></g><g class="
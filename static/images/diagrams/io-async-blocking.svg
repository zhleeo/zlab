<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" data-d2-version="v0.9.0" preserveAspectRatio="xMinYMin meet" viewBox="0 0 1205 1058"><svg class="d2-4016913016 d2-svg" width="1205" height="1058" viewBox="-11 -11 1205 1058"><rect x="-11" y="-11" width="1205" height="1058" rx="0" fill="#FFFFFF" class=" fill-N7" stroke-width="0" /><style type="text/css"><![CDATA[

		.d2-4016913016 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="ZXhwbGFpbg=="><g class="shape" ><rect x="0" y="0" width="527" height="114" stroke="#0D32B2" fill="#fce4ec" class=" stroke-B1" style="stroke-width:2;" /></g><text x="263.5" y="38.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="263.5" dy="0">异步阻塞：线程先调异步 API 提交请求（阶段1不堵），</tspan><tspan x="263.5" dy="17.25">然后立刻调用 wait/semaphore 堵着等结果（阶段2堵）</tspan><tspan x="263.5" dy="17.25">→ 跟直接用同步 read() 效果一样，但多了一次 API 调用</tspan><tspan x="263.5" dy="17.25">→ 所有 I/O 框架都不提供这个组合</tspan></text></g><g class="Y2FsbA=="><g class="shape" ><rect x="587" y="16" width="353" height="82" stroke="#0D32B2" fill="#e8eaf6" class=" stroke-B1" style="stroke-width:2;" /></g><text x="763.5" y="54.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="763.5" dy="0">线程调用 aio_read(buf) → **立刻返回**</tspan><tspan x="763.5" dy="18.5">（异步 API：不等数据）</tspan></text></g><g class="Zm9yaw=="><g class="shape" ><rect x="360" y="243" width="823" height="261" stroke="#0D32B2" fill="#f5f5f5" class=" stroke-B1" style="stroke-width:2;" /></g><text x="771.5" y="230" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">fork</text></g><g class="d2FrZQ=="><g class="shape" ><rect x="451" y="644" width="223" height="82" stroke="#0D32B2" fill="#c8e6c9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="682.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="562.5" dy="0">内核完成 → 唤醒线程</tspan><tspan x="562.5" dy="18.5">sem_wait() 返回</tspan></text></g><g class="d2h5"><g class="shape" ><rect x="267" y="846" width="591" height="190" stroke="#0D32B2" fill="#ffcdd2" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="833" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:28px">那你为什么不直接用同步 read()？</text></g><g class="Zm9yay51c2Vy"><g class="shape" ><rect x="776" y="284" width="377" height="190" stroke="#0D32B2" fill="#e8f5e9" class=" stroke-B1" style="stroke-width:2;" /></g><text x="964.5" y="272" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:24px">线程这边</text></g><g class="Zm9yay5rZXJuZWw="><g class="shape" ><rect x="390" y="300" width="346" height="158" stroke="#0D32B2" fill="#e3f2fd" class=" stroke-B1" style="stroke-width:2;" /></g><text x="563" y="288" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:24px">内核后台</text></g><g class="d2h5LmRldGFpbA=="><g class="shape" ><rect x="297" y="876" width="531" height="130" stroke="#0D32B2" fill="#ef9a9a" class=" stroke-B1" style="stroke-width:2;" /></g><text x="562.5" y="914.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="562.5" dy="0">同步 read()：堵在 read() 内部</tspan><tspan x="562.5" dy="17">异步阻塞：堵在 sem_wait() 上</tspan><tspan x="562.5" dy="17">→ 结果完全一样 —— 线程从调用到拿到数据，一直是堵的</tspan><tspan x="562.5" dy="17">→ 白白多了一次异步 API 调用的复杂度</tspan><tspan x="562.5" dy="17">→ 没有任何性能收益</tspan></text></g><g class="Zm9yay51c2VyLmJsb2Nr"><g class="shape" ><rect x="806" y="314" width="317" height="130" stroke="#0D32B2" fill="#fff3e0" class=" stroke-B1" style="stroke-width:2;" /></g><text x="964.5" y="352.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="964.5" dy="0">线程调 sem_wait() 或类似接口</tspan><tspan x="964.5" dy="17">→ **堵着等**内核通知</tspan><tspan x="964.5" dy="17">→ 线程状态：TASK_INTERRUPTIBLE</tspan><tspan x="964.5" dy="17">→ 线程占着 ~1MB 栈</tspan><tspan x="964.5" dy="17">→ **什么都干不了**</tspan></text></g><g class="Zm9yay5rZXJuZWwud29yaw=="><g class="shape" ><rect x="420" y="330" width="286" height="98" stroke="#0D32B2" fill="#bbdefb" class=" stroke-B1" style="stroke-width:2;" /></g><text x="563" y="368.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="563" dy="0">内核等数据 → 数据到了</tspan><tspan x="563" dy="17.666667">→ 拷贝到用户 buf</tspan><tspan x="563" dy="17.666667">→ 发信号/写 eventfd 通知线程</tspan></text></g><g class="KGNhbGwgLSZndDsgZm9yay51c2VyLmJsb2NrKVswXQ=="><marker id="mk-d2-4016913016-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 842.015494 98.939698 C 939.450012 150.800003 964.25 174 964.25 189 C 964.25 204 964.25 274 964.25 310" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4016913016-3488378134)" mask="url(#d2-4016913016)" /></g><g class="KGNhbGwgLSZndDsgZm9yay5rZXJuZWwud29yaylbMF0="><path d="M 684.984506 98.939698 C 587.549988 150.800003 562.75 174 562.75 189 C 562.75 204 562.75 277.200012 562.75 326" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4016913016-3488378134)" mask="url(#d2-4016913016)" /></g><g class="KGZvcmsgLSZndDsgd2FrZSlbMF0="><path d="M 562.75 506 C 562.75 576 562.75 604 562.75 640" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4016913016-3488378134)" mask="url(#d2-4016913016)" /></g><g class="KHdha2UgLSZndDsgd2h5KVswXQ=="><path d="M 562.75 728 C 562.75 766 562.75 781.799988 562.75 801" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4016913016-3488378134)" mask="url(#d2-4016913016)" /></g><mask id="d2-4016913016" maskUnits="userSpaceOnUse" x="-11" y="-11" width="1205" height="1058">
<rect x="-11" y="-11" width="1205" height="1058" fill="white"></rect>

</mask></svg></svg>
